name: Web UI workflows and recordings

on:
  push:
    paths:
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'data/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'docs/web_ui*'
      - 'package*.json'
      - 'pyproject.toml'
      - 'requirements.lock.txt'
      - 'playwright.config.mjs'
      - '.github/workflows/web-ui.yml'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobintel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jobintel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobintel -d jobintel_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      UI_PYTHON: python
      TEST_DATABASE_URL: postgresql+psycopg://jobintel:ci-only@localhost:5432/jobintel_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install -c requirements.lock.txt -e '.[dev]'
          npm ci
          npx playwright install --with-deps chromium
      - name: Check spec-to-journey coverage
        run: |
          node scripts/check_ui_contract.mjs --coverage-only
          npm run test:recordings
          npm run test:drafts
          npm run test:mutations
          npm run test:batches
      - name: Cache checksum-pinned licensed CPU weights
        uses: actions/cache@v4
        with:
          path: local_data/models
          key: qwen25-15-f16-b6eaec3509f1d0373d1f4802654c4a7bfcde0768645d2d45e8885f6922b428ee
      - name: Verify sandbox and normal PostgreSQL desktop/mobile service journeys
        run: npm run test:ui
      - name: Measure legacy and bounded catalogues on SQLite and PostgreSQL
        run: python -m scripts.catalogue_benchmark
      - name: Collect only successful attempts and update README
        id: publication
        run: |
          npm run record:ui
          npm run check:ui
          npm run prepare:ui-artifacts
      - name: Remove recorded disposable leases on every outcome
        if: always()
        run: python -m scripts.environment_lifecycle reap --all-disposable
      - name: Upload videos, browser report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            work/ui-results.json
            docs/issue-evidence/47/
            work/acquisition-browser-diagnostics.json
            work/responses-browser-diagnostics.json
            work/persistent-browser-services.json
            work/persistent-browser-local-evaluation.json
            work/environments/
          retention-days: 30
          if-no-files-found: error
      - name: Upload verified publication part 1
        uses: actions/upload-artifact@v4
        with:
          name: successful-web-ui-recordings-1
          path: work/ui-publication/part-1/
          retention-days: 30
          if-no-files-found: error
      - name: Upload verified publication part 2
        if: success() && fromJSON(steps.publication.outputs.parts) >= 2
        uses: actions/upload-artifact@v4
        with:
          name: successful-web-ui-recordings-2
          path: work/ui-publication/part-2/
          retention-days: 30
          if-no-files-found: error
      - name: Upload verified publication part 3
        if: success() && fromJSON(steps.publication.outputs.parts) >= 3
        uses: actions/upload-artifact@v4
        with:
          name: successful-web-ui-recordings-3
          path: work/ui-publication/part-3/
          retention-days: 30
          if-no-files-found: error
      - name: Upload verified publication part 4
        if: success() && fromJSON(steps.publication.outputs.parts) >= 4
        uses: actions/upload-artifact@v4
        with:
          name: successful-web-ui-recordings-4
          path: work/ui-publication/part-4/
          retention-days: 30
          if-no-files-found: error
      - name: Link evidence in the run summary
        if: always()
        run: |
          printf '%s\n' \
            '## Complete browser workflow evidence' \
            'Download the diagnostics artifact for the HTML report, videos, screenshots, and failure traces.' \
            'Only a fully passing suite produces the successful-web-ui-recordings-* artifacts. They contain an updated README and desktop/mobile recordings for every specified journey.' \
            'UI09/UI10/UI11 run normal PostgreSQL APIs with fixture replay, a separate Responses emulator and actual CPU inference. UI01-UI08 and UI12-UI15 retain the explicit synthetic sandbox. UI12 delays real API response delivery for navigation races; UI13 verifies durable mutation recovery; UI14 verifies partial batch outcomes and bounded continuation; UI15 verifies bounded registry and saved-history pagination. Measured mutation/batch and catalogue reports retain provenance. Hosted controls use fast contract tests; no paid service is called.' \
            >> "$GITHUB_STEP_SUMMARY"

  publish-readme-recordings:
    needs: workflows
    if: github.event_name != 'pull_request' && !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: successful-web-ui-recordings-*
          merge-multiple: true
          path: work/recorded-evidence
      - name: Publish passing videos and README provenance
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]; then
            echo 'The source branch advanced; a newer run will publish its own evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp work/recorded-evidence/README.md README.md
          mkdir -p docs/ui-recordings
          cp work/recorded-evidence/docs/ui-recordings/* docs/ui-recordings/
          mkdir -p docs/issue-evidence
          cp -r work/recorded-evidence/docs/issue-evidence/. docs/issue-evidence/
          node scripts/check_ui_contract.mjs
          git config user.name 'Stefan Novak'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ui-recordings docs/issue-evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh successful web UI workflow recordings [skip ci]'
          git push origin "HEAD:$DEFAULT_BRANCH"
