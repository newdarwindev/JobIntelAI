name: Local CPU inference

on:
  workflow_dispatch:
  push:
    paths: ['src/jobintel/**', 'scripts/local_*.py', 'scripts/runtime.py', 'docker-compose*.yml', 'Dockerfile*', 'requirements.lock.txt', 'pyproject.toml', '.github/workflows/local-inference.yml']
  pull_request:
    paths: ['src/jobintel/**', 'scripts/local_*.py', 'scripts/runtime.py', 'docker-compose*.yml', 'Dockerfile*', 'requirements.lock.txt', 'pyproject.toml', '.github/workflows/local-inference.yml']

permissions:
  contents: read

concurrency:
  group: local-inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: python -m pip install -c requirements.lock.txt -e .
      - name: Cache checksum-pinned licensed weights
        uses: actions/cache@v4
        with:
          path: local_data/models
          key: qwen25-15-f16-b6eaec3509f1d0373d1f4802654c4a7bfcde0768645d2d45e8885f6922b428ee
      - name: Actual unseen inference, PostgreSQL pipeline, reviewed results and recovery
        run: python -m scripts.local_smoke --project jobintel-local-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload measured model results and sanitized service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-inference-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/local-inference-service.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove only this run's containers and data volumes
        if: always()
        run: python scripts/runtime.py reset --project jobintel-local-ci-${{ github.run_id }}-${{ github.run_attempt }}
