name: automated checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, complexity and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned development tools
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Ruff lint (includes C901 complexity <= 10)
        run: python -m ruff check . --output-format github
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Install checksum-verified actionlint
        run: bash scripts/install_actionlint.sh
      - name: GitHub Actions validation
        run: local_data/bin/actionlint -color

  python:
    name: Python ${{ matrix.python-version }} / PostgreSQL
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobintel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jobintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobintel -d jobintel_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobintel:ci-only@localhost:5432/jobintel_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Tests, migrations, fixture drift, CLI smoke and distribution build
        run: |
          mkdir -p work/ci
          if python scripts/check.py --require-postgres --junitxml work/ci/junit.xml >work/ci/check.log 2>&1; then
            result=0
          else
            result=$?
          fi
          printf '%s\n' "$result" >work/ci/exit-code.txt
          cat work/ci/check.log
          exit "$result"
      - name: Summarize actual test counts and provenance
        if: always()
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          result="$(cat work/ci/exit-code.txt 2>/dev/null || echo 1)"
          python scripts/summarize_tests.py --junit work/ci/junit.xml --output work/ci/summary.json --exit-code "$result"
      - name: Upload machine-readable results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence-python-${{ matrix.python-version }}-${{ github.run_id }}
          path: work/ci/
          if-no-files-found: error
          retention-days: 30

  container:
    name: Docker Compose / API smoke
    needs: [quality, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start PostgreSQL, migrations and API
        run: docker compose up -d --build
      - name: CLI demo and evaluation in container
        run: |
          docker compose exec -T api jobintel demo
          docker compose exec -T api jobintel evaluate
      - name: Check actual HTTP API behavior
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          python scripts/container_smoke.py
      - name: Persistent dev, demo isolation and mounted OpenAI configuration (no paid calls)
        run: python scripts/runtime_smoke.py --project jobintel-runtime-online
      - name: Real acquisition origins, verified TLS, controlled proxy and PostgreSQL API
        run: python -m scripts.acquisition_smoke
      - name: Verified public authored URL through trusted gateway (no local destination DNS)
        run: |
          python -m pip install -c requirements.lock.txt -e .
          python -m scripts.acquisition_public_smoke
      - name: Upload sanitized acquisition service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-service-${{ github.run_id }}
          path: |
            work/acquisition-service.json
            work/acquisition-public.json
          if-no-files-found: warn
          retention-days: 30
      - name: Prepare verified wheels and exercise the offline runtime
        run: |
          python -m pip wheel --wheel-dir build/wheels -c requirements.lock.txt -r requirements.lock.txt 'setuptools>=75' wheel .
          python scripts/runtime_smoke.py --project jobintel-runtime-offline --port 18081 --offline
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI containers
        if: always()
        run: docker compose down --volumes
