name: automated checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, complexity and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned development tools
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Ruff lint (includes C901 complexity <= 10)
        run: python -m ruff check . --output-format github
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Install checksum-verified actionlint
        run: bash scripts/install_actionlint.sh
      - name: GitHub Actions validation
        run: local_data/bin/actionlint -color

  python:
    name: Python ${{ matrix.python-version }} / PostgreSQL
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobintel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jobintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobintel -d jobintel_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobintel:ci-only@localhost:5432/jobintel_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Tests, migrations, fixture drift, CLI smoke and distribution build
        run: python scripts/check.py --require-postgres

  container:
    name: Docker Compose / API smoke
    needs: [quality, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start PostgreSQL, migrations and API
        run: docker compose up -d --build
      - name: CLI demo and evaluation in container
        run: |
          docker compose exec -T api jobintel demo
          docker compose exec -T api jobintel evaluate
      - name: Check actual HTTP API behavior
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          python scripts/container_smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI containers
        if: always()
        run: docker compose down --volumes
