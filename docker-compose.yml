services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobintel
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel -d jobintel"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    build: .
    environment:
      JOBINTEL_DATABASE_URL: postgresql+psycopg://jobintel:local-demo-only@db/jobintel
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      JOBINTEL_DATABASE_URL: postgresql+psycopg://jobintel:local-demo-only@db/jobintel
      JOBINTEL_PROVIDER: fixture
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
