[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobintel-ai"
version = "0.1.0"
description = "Evidence-grounded job requirements intelligence — offline-first scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1", "build>=1.2,<2", "shellcheck-py>=0.10,<1"]

[project.scripts]
jobintel = "jobintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "local_data", "results/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "PIE", "RUF", "C90"]

[tool.ruff.lint.mccabe]
# C901 fails CI for any function above this bound; no per-file complexity exemptions.
max-complexity = 10
